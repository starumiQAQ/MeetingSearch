<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MeetingSearch</title>
    <style>
      :root {
        --ink: #1a1f2e;
        --muted: #5c6578;
        --line: #d8dde8;
        --bg: #f3f5f9;
        --panel: #ffffff;
        --accent: #0f6b5c;
        --accent-soft: #e6f3f0;
        --danger: #9b2c2c;
        --danger-bg: #fdeaea;
        --recommend: #0b4f44;
        --map-empty: rgba(243, 245, 249, 0.92);
        --drawer-shadow: 0 -8px 32px rgba(26, 31, 46, 0.12);
        --header-h: 3.5rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 10% -10%, #d7ebe6 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 0%, #e4e9f5 0%, transparent 50%),
          var(--bg);
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100vh;
      }

      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: blur(8px);
        min-height: var(--header-h);
      }

      .brand-block {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
      }

      .brand-block h1 {
        font-family: "IBM Plex Serif", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.35rem, 2.5vw, 1.75rem);
        letter-spacing: -0.02em;
        margin: 0;
      }

      .brand-block .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .layout {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(280px, 380px) 1fr;
        min-height: 0;
      }

      .side {
        overflow: auto;
        padding: 1.1rem 1.15rem 2rem;
        border-right: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 70%, transparent);
      }

      .side form {
        display: grid;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
      }

      input,
      select {
        font: inherit;
        padding: 0.55rem 0.65rem;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 2px;
      }

      .participants {
        display: grid;
        gap: 0.75rem;
      }

      .participant-row {
        display: grid;
        grid-template-columns: 1fr 1.6fr auto;
        gap: 0.5rem;
        align-items: end;
      }

      .participant-row button {
        height: 2.4rem;
      }

      .prefs {
        display: grid;
        gap: 0.75rem;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        padding: 0.5rem 0.85rem;
        border-radius: 2px;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 0.65rem 1.2rem;
        width: 100%;
      }

      button.primary:hover {
        filter: brightness(1.05);
      }

      button.primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        filter: none;
      }

      button.ghost {
        background: transparent;
      }

      #status {
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0;
        line-height: 1.45;
      }

      .map-pane {
        position: relative;
        min-height: 320px;
        background: #e8ecf3;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .map-placeholder,
      .map-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        padding: 2rem;
        text-align: center;
        pointer-events: none;
        z-index: 1;
      }

      .map-placeholder {
        background: var(--map-empty);
        pointer-events: auto;
      }

      .map-empty {
        background: transparent;
      }

      .map-empty.hidden,
      .map-placeholder.hidden {
        display: none;
      }

      .map-empty h2,
      .map-placeholder h2 {
        margin: 0;
        font-family: "IBM Plex Serif", Georgia, serif;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .map-empty p,
      .map-placeholder p {
        margin: 0;
        color: var(--muted);
        max-width: 22rem;
        line-height: 1.5;
        justify-self: center;
      }

      .drawer {
        position: absolute;
        left: 0.75rem;
        right: 0.75rem;
        bottom: 0.75rem;
        max-height: min(48%, 420px);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--drawer-shadow);
        z-index: 2;
        transform: translateY(110%);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.28s ease,
          opacity 0.2s ease;
      }

      .drawer.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.65rem 0.85rem;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }

      .drawer-header h2 {
        margin: 0;
        font-size: 1rem;
      }

      .drawer-body {
        overflow: auto;
        padding: 0.85rem;
        display: grid;
        gap: 0.75rem;
      }

      .empty {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid #f0c2c2;
        padding: 1rem 1.1rem;
        line-height: 1.45;
      }

      .empty p {
        margin: 0 0 0.65rem;
      }

      .empty p:last-child {
        margin-bottom: 0;
      }

      .disambiguation {
        display: grid;
        gap: 1rem;
      }

      .disambiguation-block {
        display: grid;
        gap: 0.45rem;
      }

      .disambiguation-block p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .choice {
        display: flex;
        gap: 0.55rem;
        align-items: flex-start;
        font-weight: 400;
        font-size: 0.95rem;
        padding: 0.35rem 0.4rem;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .choice:hover,
      .choice.selected {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      }

      .choice input {
        margin-top: 0.25rem;
      }

      .ranking {
        display: grid;
        gap: 0.65rem;
      }

      .entry {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 0.85rem 0.95rem;
        cursor: pointer;
        text-align: left;
        width: 100%;
        font: inherit;
        color: inherit;
      }

      .entry:hover {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      }

      .entry.recommendation {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .entry.active {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .entry h3 {
        margin: 0 0 0.2rem;
        font-size: 1.05rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--recommend);
        margin-bottom: 0.35rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 0.5rem;
      }

      .distances {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      @media (max-width: 840px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(50vh, 1fr);
        }

        .side {
          border-right: none;
          border-bottom: 1px solid var(--line);
          max-height: none;
        }

        .participant-row {
          grid-template-columns: 1fr;
        }

        .drawer {
          max-height: min(55%, 360px);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand-block">
          <h1 id="product-title">MeetingSearch</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="ghost" id="lang-toggle" aria-label="Language">
            EN
          </button>
        </div>
      </header>

      <div class="layout">
        <aside class="side">
          <form id="search-form">
            <p class="hint" data-i18n="demoHint"></p>
            <div class="participants" id="participants"></div>
            <button type="button" id="add-participant" data-i18n="addParticipant"></button>

            <div class="prefs">
              <label>
                <span data-i18n="brand"></span>
                <input name="brand" value="滨寿司" required />
              </label>
              <label>
                <span data-i18n="objective"></span>
                <select name="objective">
                  <option value="total_distance" data-i18n="objectiveTotal"></option>
                  <option value="minimax" data-i18n="objectiveMinimax"></option>
                </select>
              </label>
              <label>
                <span data-i18n="radius"></span>
                <input
                  name="radiusMeters"
                  type="number"
                  min="1"
                  data-i18n-placeholder="radiusPlaceholder"
                />
              </label>
            </div>

            <button class="primary" type="submit" id="search-button" data-i18n="search"></button>
            <div id="status"></div>
          </form>
        </aside>

        <section class="map-pane" aria-label="Map">
          <div id="map"></div>
          <div class="map-placeholder" id="map-placeholder">
            <h2 data-i18n="mapUnavailableTitle"></h2>
            <p data-i18n="mapUnavailableBody"></p>
          </div>
          <div class="map-empty" id="map-empty">
            <h2 data-i18n="mapEmptyTitle"></h2>
            <p data-i18n="mapEmptyBody"></p>
          </div>
          <div class="drawer" id="drawer" aria-hidden="true">
            <div class="drawer-header">
              <h2 id="drawer-title"></h2>
              <button type="button" class="ghost" id="drawer-close" data-i18n="drawerCollapse"></button>
            </div>
            <div class="drawer-body" id="drawer-body"></div>
          </div>
        </section>
      </div>
    </div>

    <script>
      window.__MAP_UI__ = /*__MAP_UI_CONFIG__*/null;
    </script>
    <script>
      const MAP_BRANCH_LIMIT = 5;
      const LOCALE_KEY = "meetingsearch.locale";

      const STRINGS = {
        en: {
          productTitle: "MeetingSearch",
          tagline: "Find a Brand Branch that fits everyone.",
          demoHint:
            "Demo addresses: 海淀区中关村 (unique), 望京 (ambiguous), 朝阳区三里屯 (unique).",
          addParticipant: "Add Participant",
          brand: "Brand",
          objective: "Proximity objective",
          objectiveTotal: "Total distance",
          objectiveMinimax: "Minimax",
          radius: "Radius (meters, optional)",
          radiusPlaceholder: "15000 (default)",
          search: "Search",
          label: "Label",
          address: "Address",
          remove: "Remove",
          langToggle: "中文",
          mapUnavailableTitle: "Map unavailable",
          mapUnavailableBody:
            "Set AMAP_JS_KEY (and AMAP_SECURITY_JS_CODE if required) in .env to show the 高德 map. Search still works without it.",
          mapEmptyTitle: "Ready when you are",
          mapEmptyBody:
            "Add at least two Participants, then Search. Resolved locations appear on the map.",
          drawerCollapse: "Collapse",
          drawerPickTitle: "Pick a location",
          drawerRankingTitle: "Ranking",
          drawerEmptyTitle: "Empty candidate set",
          continueSearch: "Continue search",
          recommendation: "Recommendation",
          needTwo: "At least two Participants are required.",
          geocoding: "Geocoding addresses…",
          chooseMatches: "Choose a match for each ambiguous address before searching.",
          selectAll: "Select one option for each ambiguous address before searching.",
          searching: "Searching…",
          searchingCached: "Searching with saved Participant locations…",
          noGeocode: (addr) => `No geocode match for “${addr}”. Try a different address.`,
          ambiguousLead: (addr) => `Address “${addr}” matched multiple places:`,
          emptyHint:
            "Increase the radius or change the Brand above, then search again to recover from an Empty candidate set.",
          objectiveTotalShort: "total distance (sum)",
          objectiveMinimaxShort: "minimax (max Distance)",
          mapLoadError: "Could not load the 高德 map. Check AMAP_JS_KEY / security code.",
        },
        zh: {
          productTitle: "约了吗",
          tagline: "为大家找到合适的 Brand Branch。",
          demoHint:
            "演示地址：「海淀区中关村」（唯一）、「望京」（歧义）、「朝阳区三里屯」（唯一）。",
          addParticipant: "添加 Participant",
          brand: "Brand",
          objective: "Proximity objective",
          objectiveTotal: "总距离最小",
          objectiveMinimax: "最远人最小（minimax）",
          radius: "搜索半径（米，可选）",
          radiusPlaceholder: "15000（默认）",
          search: "搜索",
          label: "称呼",
          address: "地址",
          remove: "移除",
          langToggle: "EN",
          mapUnavailableTitle: "地图未启用",
          mapUnavailableBody:
            "在 .env 中设置 AMAP_JS_KEY（如需要再设 AMAP_SECURITY_JS_CODE）即可显示高德地图。无地图时仍可搜索。",
          mapEmptyTitle: "准备好了就开始",
          mapEmptyBody: "至少添加两位 Participant，然后搜索。解析后的位置会显示在地图上。",
          drawerCollapse: "收起",
          drawerPickTitle: "选择地点",
          drawerRankingTitle: "Ranking",
          drawerEmptyTitle: "Empty candidate set",
          continueSearch: "继续搜索",
          recommendation: "推荐",
          needTwo: "至少需要两位 Participant。",
          geocoding: "正在解析地址…",
          chooseMatches: "请为每个有歧义的地址选择一个匹配项，再继续搜索。",
          selectAll: "请为每个有歧义的地址都选一项，再继续搜索。",
          searching: "正在搜索…",
          searchingCached: "使用已保存的 Participant 位置搜索…",
          noGeocode: (addr) => `找不到「${addr}」的地理编码结果，请换一个地址。`,
          ambiguousLead: (addr) => `地址「${addr}」匹配到多处：`,
          emptyHint: "加大搜索半径或更换 Brand，然后再次搜索，以从 Empty candidate set 恢复。",
          objectiveTotalShort: "总距离（求和）",
          objectiveMinimaxShort: "minimax（最大 Distance）",
          mapLoadError: "高德地图加载失败，请检查 AMAP_JS_KEY / 安全密钥。",
        },
      };

      const presets = [
        { label: "Haidian", address: "海淀区中关村" },
        { label: "Wangjing", address: "望京" },
        { label: "Chaoyang", address: "朝阳区三里屯" },
      ];

      const mapUi = window.__MAP_UI__ && typeof window.__MAP_UI__ === "object"
        ? window.__MAP_UI__
        : { jsKey: "", securityJsCode: "" };

      const participantsEl = document.getElementById("participants");
      const form = document.getElementById("search-form");
      const statusEl = document.getElementById("status");
      const searchButton = document.getElementById("search-button");
      const drawerEl = document.getElementById("drawer");
      const drawerTitleEl = document.getElementById("drawer-title");
      const drawerBodyEl = document.getElementById("drawer-body");
      const drawerCloseBtn = document.getElementById("drawer-close");
      const mapPlaceholderEl = document.getElementById("map-placeholder");
      const mapEmptyEl = document.getElementById("map-empty");
      const productTitleEl = document.getElementById("product-title");
      const langToggleBtn = document.getElementById("lang-toggle");

      /** @type {'en'|'zh'} */
      let locale = detectLocale();
      /** Pending disambiguation: { resolved, ambiguous, fingerprint } */
      let pendingAmbiguous = null;
      /** Cached geocoded Participants + fingerprint of address rows. */
      let lastResolved = null;
      /** @type {null | { entries: any[], participants: any[], objective: string }} */
      let lastRanking = null;
      let selectedBranchIndex = 0;

      /** @type {any} */
      let AMapNS = null;
      /** @type {any} */
      let map = null;
      /** @type {any[]} */
      let participantMarkers = [];
      /** @type {any[]} */
      let candidateMarkers = [];
      /** @type {any[]} */
      let branchMarkers = [];

      function detectLocale() {
        try {
          const saved = localStorage.getItem(LOCALE_KEY);
          if (saved === "zh" || saved === "en") return saved;
        } catch {
          /* ignore */
        }
        const nav = (navigator.language || "en").toLowerCase();
        return nav.startsWith("zh") ? "zh" : "en";
      }

      function t(key, ...args) {
        const table = STRINGS[locale];
        const value = table[key] ?? STRINGS.en[key] ?? key;
        return typeof value === "function" ? value(...args) : value;
      }

      function applyI18n() {
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        document.title = t("productTitle");
        productTitleEl.textContent = t("productTitle");
        langToggleBtn.textContent = t("langToggle");

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (key) el.textContent = t(key);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (key && "placeholder" in el) el.placeholder = t(key);
        });

        participantsEl.querySelectorAll(".participant-row").forEach((row) => {
          const labelSpan = row.querySelector('[data-field="label"]');
          const addressSpan = row.querySelector('[data-field="address"]');
          const removeBtn = row.querySelector(".remove");
          if (labelSpan) labelSpan.textContent = t("label");
          if (addressSpan) addressSpan.textContent = t("address");
          if (removeBtn) removeBtn.textContent = t("remove");
        });

        if (drawerEl.classList.contains("open")) {
          if (pendingAmbiguous) {
            openDrawer(t("drawerPickTitle"), renderDisambiguation(pendingAmbiguous.ambiguous));
          } else if (lastRanking) {
            openDrawer(
              t("drawerRankingTitle"),
              renderRanking(lastRanking.data, lastRanking.participants),
            );
          }
        }
      }

      langToggleBtn.addEventListener("click", () => {
        locale = locale === "zh" ? "en" : "zh";
        try {
          localStorage.setItem(LOCALE_KEY, locale);
        } catch {
          /* ignore */
        }
        applyI18n();
      });

      function readParticipantDrafts() {
        const rows = [...participantsEl.querySelectorAll(".participant-row")];
        return rows.map((row, i) => ({
          id: `p${i + 1}`,
          label: row.querySelector('[name="label"]').value.trim(),
          address: row.querySelector('[name="address"]').value.trim(),
        }));
      }

      function participantFingerprint(drafts) {
        return drafts.map((d) => `${d.id}\0${d.address}`).join("\n");
      }

      function clearResolvedCache() {
        lastResolved = null;
        lastRanking = null;
        clearParticipantMarkers();
        clearBranchMarkers();
        updateMapEmptyVisibility();
      }

      function rememberResolved(participants, fingerprint) {
        lastResolved = { participants, fingerprint };
        paintParticipantMarkers(participants);
        updateMapEmptyVisibility();
      }

      function addParticipantRow(preset) {
        const row = document.createElement("div");
        row.className = "participant-row";
        row.innerHTML = `
          <label><span data-field="label">${escapeHtml(t("label"))}</span>
            <input name="label" value="${escapeAttr(preset?.label ?? "")}" required />
          </label>
          <label><span data-field="address">${escapeHtml(t("address"))}</span>
            <input name="address" value="${escapeAttr(preset?.address ?? "")}" required />
          </label>
          <button type="button" class="remove">${escapeHtml(t("remove"))}</button>
        `;
        row.querySelector(".remove").addEventListener("click", () => {
          if (participantsEl.children.length <= 2) {
            statusEl.textContent = t("needTwo");
            return;
          }
          row.remove();
          clearDisambiguation();
          closeDrawer();
          clearResolvedCache();
        });
        row.querySelector('[name="address"]').addEventListener("input", () => {
          clearDisambiguation();
          closeDrawer();
          clearResolvedCache();
        });
        participantsEl.appendChild(row);
      }

      addParticipantRow(presets[0]);
      addParticipantRow(presets[1]);

      document.getElementById("add-participant").addEventListener("click", () => {
        const next = presets[participantsEl.children.length] ?? {
          label: `Participant ${participantsEl.children.length + 1}`,
          address: "",
        };
        addParticipantRow(next);
        clearDisambiguation();
        closeDrawer();
        clearResolvedCache();
      });

      drawerCloseBtn.addEventListener("click", () => {
        closeDrawer();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearDisambiguation();
        clearBranchMarkers();
        lastRanking = null;
        searchButton.disabled = true;

        const drafts = readParticipantDrafts();
        if (drafts.length < 2) {
          statusEl.textContent = t("needTwo");
          searchButton.disabled = false;
          return;
        }

        const fingerprint = participantFingerprint(drafts);
        if (
          lastResolved &&
          lastResolved.fingerprint === fingerprint &&
          lastResolved.participants.length === drafts.length
        ) {
          const refreshed = lastResolved.participants.map((p, i) => ({
            ...p,
            id: drafts[i].id,
            label: drafts[i].label,
          }));
          rememberResolved(refreshed, fingerprint);
          statusEl.textContent = t("searchingCached");
          await runSearch(refreshed);
          return;
        }

        statusEl.textContent = t("geocoding");

        try {
          const geocoded = [];
          const ambiguous = [];

          for (const draft of drafts) {
            const res = await fetch("/api/geocode", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ address: draft.address }),
            });
            const data = await res.json();
            if (!res.ok) {
              throw new Error(apiFailureMessage(data, "Geocode failed"));
            }
            const candidates = data.candidates ?? [];
            if (candidates.length === 0) {
              statusEl.textContent = t("noGeocode", draft.address);
              searchButton.disabled = false;
              return;
            }
            if (candidates.length === 1) {
              geocoded.push({
                id: draft.id,
                label: draft.label,
                coordinates: candidates[0].coordinates,
                formattedAddress: candidates[0].formattedAddress,
              });
            } else {
              ambiguous.push({
                id: draft.id,
                label: draft.label,
                address: draft.address,
                candidates,
                selectedIndex: null,
              });
            }
          }

          if (geocoded.length) {
            paintParticipantMarkers(geocoded);
            updateMapEmptyVisibility();
          }

          if (ambiguous.length > 0) {
            pendingAmbiguous = { resolved: geocoded, ambiguous, fingerprint };
            statusEl.textContent = t("chooseMatches");
            paintCandidateMarkers(ambiguous);
            openDrawer(t("drawerPickTitle"), renderDisambiguation(ambiguous));
            searchButton.disabled = false;
            return;
          }

          rememberResolved(geocoded, fingerprint);
          await runSearch(geocoded);
        } catch (err) {
          statusEl.textContent = err.message ?? String(err);
          searchButton.disabled = false;
        }
      });

      function clearDisambiguation() {
        pendingAmbiguous = null;
        clearCandidateMarkers();
      }

      function openDrawer(title, html) {
        drawerTitleEl.textContent = title;
        drawerBodyEl.innerHTML = html;
        drawerEl.classList.add("open");
        drawerEl.setAttribute("aria-hidden", "false");
      }

      function closeDrawer() {
        drawerEl.classList.remove("open");
        drawerEl.setAttribute("aria-hidden", "true");
      }

      function renderDisambiguation(ambiguous) {
        const blocks = ambiguous
          .map((item, blockIndex) => {
            const choices = item.candidates
              .map(
                (c, i) => `
                <label class="choice" data-block="${blockIndex}" data-choice="${i}">
                  <input
                    type="radio"
                    name="pick-${blockIndex}"
                    value="${i}"
                    data-block="${blockIndex}"
                  />
                  <span>${escapeHtml(c.formattedAddress)}</span>
                </label>`,
              )
              .join("");
            return `
              <div class="disambiguation-block" data-block="${blockIndex}">
                <strong>${escapeHtml(item.label)}</strong>
                <p>${escapeHtml(t("ambiguousLead", item.address))}</p>
                ${choices}
              </div>`;
          })
          .join("");

        return `
          <div class="disambiguation" id="disambiguation">
            ${blocks}
            <button class="primary" type="button" id="confirm-disambiguation" disabled>
              ${escapeHtml(t("continueSearch"))}
            </button>
          </div>`;
      }

      drawerBodyEl.addEventListener("change", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== "radio") {
          return;
        }
        if (!pendingAmbiguous) return;
        const blockIndex = Number(input.dataset.block);
        if (!Number.isFinite(blockIndex)) return;
        pendingAmbiguous.ambiguous[blockIndex].selectedIndex = Number(input.value);
        highlightChoice(blockIndex, Number(input.value));
        focusCandidateMarker(blockIndex, Number(input.value));
        const confirmBtn = document.getElementById("confirm-disambiguation");
        if (confirmBtn) {
          const allPicked = pendingAmbiguous.ambiguous.every(
            (item) => item.selectedIndex !== null,
          );
          confirmBtn.disabled = !allPicked;
        }
      });

      drawerBodyEl.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const entryBtn = target.closest(".entry");
        if (entryBtn instanceof HTMLElement && entryBtn.dataset.rankIndex != null) {
          const index = Number(entryBtn.dataset.rankIndex);
          if (Number.isFinite(index)) selectBranch(index, true);
          return;
        }

        if (target.id !== "confirm-disambiguation") return;
        if (!pendingAmbiguous) return;

        const allPicked = pendingAmbiguous.ambiguous.every(
          (item) => item.selectedIndex !== null,
        );
        if (!allPicked) {
          statusEl.textContent = t("selectAll");
          return;
        }

        const participants = [
          ...pendingAmbiguous.resolved,
          ...pendingAmbiguous.ambiguous.map((item) => {
            const chosen = item.candidates[item.selectedIndex];
            return {
              id: item.id,
              label: item.label,
              coordinates: chosen.coordinates,
              formattedAddress: chosen.formattedAddress,
            };
          }),
        ];

        participants.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));

        const fingerprint = pendingAmbiguous.fingerprint;
        clearDisambiguation();
        closeDrawer();
        rememberResolved(participants, fingerprint);
        await runSearch(participants);
      });

      function highlightChoice(blockIndex, choiceIndex) {
        drawerBodyEl.querySelectorAll(`.choice[data-block="${blockIndex}"]`).forEach((el) => {
          el.classList.toggle(
            "selected",
            Number(el.getAttribute("data-choice")) === choiceIndex,
          );
        });
      }

      async function runSearch(participants) {
        statusEl.textContent = t("searching");
        searchButton.disabled = true;

        const fd = new FormData(form);
        const radiusRaw = fd.get("radiusMeters");
        const payload = {
          participants: participants.map(({ id, label, coordinates }) => ({
            id,
            label,
            coordinates,
          })),
          brand: fd.get("brand"),
          objective: fd.get("objective"),
        };
        if (radiusRaw && String(radiusRaw).trim() !== "") {
          payload.radiusMeters = Number(radiusRaw);
        }

        try {
          const res = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (data.kind === "empty_candidate_set") {
            statusEl.textContent = "";
            clearBranchMarkers();
            lastRanking = null;
            openDrawer(t("drawerEmptyTitle"), renderEmptyCandidateSet(data.message));
            return;
          }

          if (data.kind === "map_provider_error") {
            statusEl.textContent = data.message ?? "Map provider error";
            return;
          }

          if (!res.ok) {
            statusEl.textContent = apiFailureMessage(data, "Search failed");
            return;
          }

          statusEl.textContent = "";
          lastRanking = { data, participants };
          selectedBranchIndex = 0;
          paintBranchMarkers(data.entries);
          openDrawer(t("drawerRankingTitle"), renderRanking(data, participants));
          selectBranch(0, true);
        } catch (err) {
          statusEl.textContent = err.message ?? String(err);
        } finally {
          searchButton.disabled = false;
        }
      }

      function renderEmptyCandidateSet(message) {
        return `
          <div class="empty">
            <p>${escapeHtml(message)}</p>
            <p class="hint">${escapeHtml(t("emptyHint"))}</p>
          </div>`;
      }

      function labelById(participants) {
        const mapLabels = Object.create(null);
        for (const p of participants) {
          mapLabels[p.id] = p.label || p.id;
        }
        return mapLabels;
      }

      function renderRanking(data, participants) {
        const labels = labelById(participants ?? lastResolved?.participants ?? []);
        const objectiveLabel =
          data.objective === "minimax"
            ? t("objectiveMinimaxShort")
            : t("objectiveTotalShort");
        const entries = data.entries
          .map((entry, index) => {
            const isTop = index === 0;
            const distances = Object.entries(entry.distances)
              .map(([id, meters]) => {
                const name = labels[id] ?? id;
                return `<li><strong>${escapeHtml(name)}</strong>: ${meters.toLocaleString()} m</li>`;
              })
              .join("");
            return `
              <button type="button" class="entry ${isTop ? "recommendation" : ""} ${index === selectedBranchIndex ? "active" : ""}" data-rank-index="${index}">
                ${isTop ? `<div class="badge">${escapeHtml(t("recommendation"))}</div>` : ""}
                <h3>${escapeHtml(entry.branch.name)}</h3>
                <p class="meta">${escapeHtml(entry.branch.address)} · score ${entry.score.toLocaleString()} m (${escapeHtml(objectiveLabel)})</p>
                <ul class="distances">${distances}</ul>
              </button>
            `;
          })
          .join("");
        return `<div class="ranking">${entries}</div>`;
      }

      function selectBranch(index, panMap) {
        selectedBranchIndex = index;
        drawerBodyEl.querySelectorAll(".entry").forEach((el) => {
          el.classList.toggle("active", Number(el.dataset.rankIndex) === index);
        });
        refreshBranchMarkerLabels();
        if (panMap && branchMarkers[index] && map) {
          const marker = branchMarkers[index];
          map.setCenter(marker.getPosition());
          map.setZoom(Math.max(map.getZoom(), 14));
        }
      }

      function apiFailureMessage(data, fallback) {
        if (data && data.kind === "map_provider_error" && data.message) {
          return data.message;
        }
        if (data && typeof data.message === "string" && data.message) {
          return data.message;
        }
        if (data && typeof data.error === "string" && data.error) {
          return data.error;
        }
        return fallback;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function lngLat(coords) {
        return [coords.lng, coords.lat];
      }

      function clearMarkers(list) {
        for (const m of list) {
          try {
            m.setMap(null);
          } catch {
            /* ignore */
          }
        }
        list.length = 0;
      }

      function clearParticipantMarkers() {
        clearMarkers(participantMarkers);
      }

      function clearCandidateMarkers() {
        clearMarkers(candidateMarkers);
      }

      function clearBranchMarkers() {
        clearMarkers(branchMarkers);
      }

      function fitToMarkers() {
        if (!map) return;
        const all = [...participantMarkers, ...candidateMarkers, ...branchMarkers];
        if (all.length === 0) return;
        map.setFitView(all, false, [60, 60, 60, 80]);
      }

      function updateMapEmptyVisibility() {
        const hasPeople =
          participantMarkers.length > 0 ||
          candidateMarkers.length > 0 ||
          (lastResolved && lastResolved.participants.length > 0);
        mapEmptyEl.classList.toggle("hidden", Boolean(hasPeople) || !map);
      }

      function paintParticipantMarkers(participants) {
        if (!map || !AMapNS) return;
        clearParticipantMarkers();
        for (const p of participants) {
          const marker = new AMapNS.Marker({
            position: lngLat(p.coordinates),
            title: p.label,
            label: {
              content: `<span style="padding:2px 6px;background:#fff;border:1px solid #0f6b5c;color:#0f6b5c;font-size:12px;">${escapeHtml(p.label)}</span>`,
              direction: "top",
            },
          });
          marker.setMap(map);
          participantMarkers.push(marker);
        }
        fitToMarkers();
      }

      function paintCandidateMarkers(ambiguous) {
        if (!map || !AMapNS) return;
        clearCandidateMarkers();
        ambiguous.forEach((item, blockIndex) => {
          item.candidates.forEach((c, choiceIndex) => {
            const marker = new AMapNS.Marker({
              position: lngLat(c.coordinates),
              title: c.formattedAddress,
              content: `<div style="width:14px;height:14px;border-radius:50%;background:#0f6b5c;border:2px solid #fff;box-shadow:0 0 0 1px #0f6b5c;opacity:0.85;"></div>`,
              offset: new AMapNS.Pixel(-7, -7),
            });
            marker.on("click", () => {
              if (!pendingAmbiguous) return;
              pendingAmbiguous.ambiguous[blockIndex].selectedIndex = choiceIndex;
              const radio = drawerBodyEl.querySelector(
                `input[name="pick-${blockIndex}"][value="${choiceIndex}"]`,
              );
              if (radio instanceof HTMLInputElement) {
                radio.checked = true;
                radio.dispatchEvent(new Event("change", { bubbles: true }));
              } else {
                highlightChoice(blockIndex, choiceIndex);
                const confirmBtn = document.getElementById("confirm-disambiguation");
                if (confirmBtn) {
                  const allPicked = pendingAmbiguous.ambiguous.every(
                    (row) => row.selectedIndex !== null,
                  );
                  confirmBtn.disabled = !allPicked;
                }
              }
            });
            marker.setMap(map);
            candidateMarkers.push(marker);
            marker._blockIndex = blockIndex;
            marker._choiceIndex = choiceIndex;
          });
        });
        fitToMarkers();
      }

      function focusCandidateMarker(blockIndex, choiceIndex) {
        for (const marker of candidateMarkers) {
          const selected =
            marker._blockIndex === blockIndex && marker._choiceIndex === choiceIndex;
          marker.setContent(
            `<div style="width:${selected ? 18 : 14}px;height:${selected ? 18 : 14}px;border-radius:50%;background:#0f6b5c;border:2px solid #fff;box-shadow:0 0 0 ${selected ? 2 : 1}px #0f6b5c;opacity:${selected ? 1 : 0.85};"></div>`,
          );
        }
        const marker = candidateMarkers.find(
          (m) => m._blockIndex === blockIndex && m._choiceIndex === choiceIndex,
        );
        if (marker && map) {
          map.setCenter(marker.getPosition());
          map.setZoom(Math.max(map.getZoom(), 14));
        }
      }

      function paintBranchMarkers(entries) {
        if (!map || !AMapNS) return;
        clearBranchMarkers();
        const slice = entries.slice(0, MAP_BRANCH_LIMIT);
        slice.forEach((entry, index) => {
          const isTop = index === 0;
          const marker = new AMapNS.Marker({
            position: lngLat(entry.branch.coordinates),
            title: entry.branch.name,
            label: {
              content: branchLabelHtml(entry.branch.name, isTop, false),
              direction: "top",
            },
          });
          marker._rankIndex = index;
          marker._branchName = entry.branch.name;
          marker._isTop = isTop;
          marker.on("click", () => {
            selectBranch(index, false);
            const el = drawerBodyEl.querySelector(`[data-rank-index="${index}"]`);
            if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
            if (!drawerEl.classList.contains("open") && lastRanking) {
              openDrawer(
                t("drawerRankingTitle"),
                renderRanking(lastRanking.data, lastRanking.participants),
              );
              selectBranch(index, false);
            }
          });
          marker.setMap(map);
          branchMarkers.push(marker);
        });
        fitToMarkers();
      }

      function branchLabelHtml(name, isTop, selected) {
        const bg = selected ? "#0f6b5c" : isTop ? "#e6f3f0" : "#fff";
        const fg = selected ? "#fff" : "#1a1f2e";
        const weight = isTop || selected ? "600" : "400";
        return `<span style="padding:2px 6px;background:${bg};color:${fg};border:1px solid #0f6b5c;font-size:12px;font-weight:${weight};">${escapeHtml(name)}</span>`;
      }

      function refreshBranchMarkerLabels() {
        for (const marker of branchMarkers) {
          const selected = marker._rankIndex === selectedBranchIndex;
          marker.setLabel({
            content: branchLabelHtml(marker._branchName, marker._isTop, selected),
            direction: "top",
          });
        }
      }

      function loadAmap() {
        const jsKey = (mapUi.jsKey || "").trim();
        if (!jsKey) {
          mapPlaceholderEl.classList.remove("hidden");
          mapEmptyEl.classList.add("hidden");
          return Promise.resolve(false);
        }

        mapPlaceholderEl.classList.add("hidden");

        const security = (mapUi.securityJsCode || "").trim();
        if (security) {
          window._AMapSecurityConfig = { securityJsCode: security };
        }

        return new Promise((resolve) => {
          const existing = document.querySelector("script[data-amap-loader]");
          const start = () => {
            if (!window.AMapLoader) {
              statusEl.textContent = t("mapLoadError");
              mapPlaceholderEl.classList.remove("hidden");
              resolve(false);
              return;
            }
            window.AMapLoader.load({
              key: jsKey,
              version: "2.0",
            })
              .then((AMap) => {
                AMapNS = AMap;
                map = new AMap.Map("map", {
                  zoom: 11,
                  center: [116.397428, 39.90923],
                  viewMode: "2D",
                });
                mapEmptyEl.classList.remove("hidden");
                resolve(true);
              })
              .catch(() => {
                statusEl.textContent = t("mapLoadError");
                mapPlaceholderEl.classList.remove("hidden");
                resolve(false);
              });
          };

          if (window.AMapLoader) {
            start();
            return;
          }

          if (existing) {
            existing.addEventListener("load", start);
            existing.addEventListener("error", () => {
              mapPlaceholderEl.classList.remove("hidden");
              resolve(false);
            });
            return;
          }

          const script = document.createElement("script");
          script.src = "https://webapi.amap.com/loader.js";
          script.async = true;
          script.dataset.amapLoader = "1";
          script.onload = start;
          script.onerror = () => {
            mapPlaceholderEl.classList.remove("hidden");
            resolve(false);
          };
          document.head.appendChild(script);
        });
      }

      applyI18n();
      loadAmap().then(() => {
        updateMapEmptyVisibility();
      });
    </script>
  </body>
</html>
