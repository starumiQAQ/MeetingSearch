<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>约了吗</title>
    <style>
      :root {
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --bg: #f3f4f8;
        --panel: #ffffff;
        --accent: #059669;
        --accent-hover: #047857;
        --accent-soft: #ecfdf5;
        --blue: #3b82f6;
        --blue-soft: #eff6ff;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --recommend: #047857;
        --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        --radius: 14px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: -apple-system, system-ui, "PingFang SC", "Helvetica Neue",
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 0% 0%, #e0e7ff 0%, transparent 55%),
          radial-gradient(ellipse 55% 40% at 100% 0%, #d1fae5 0%, transparent 50%),
          var(--bg);
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100vh;
      }

      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.5rem 0.75rem;
      }

      .brand-block {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
      }

      .brand-mark {
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 999px;
        background: linear-gradient(145deg, #60a5fa, #3b82f6);
        color: #fff;
        display: grid;
        place-content: center;
        font-size: 1.1rem;
        flex: 0 0 auto;
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.28);
      }

      .brand-text h1 {
        font-weight: 700;
        font-size: 1.35rem;
        margin: 0;
        letter-spacing: -0.02em;
      }

      .brand-text .tagline {
        margin: 0.1rem 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .api-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8rem;
        box-shadow: var(--shadow);
      }

      .api-pill .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
      }

      .api-pill.offline .dot {
        background: #9ca3af;
        box-shadow: none;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 40;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(460px, 100%);
        background: var(--panel);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
        padding: 1.15rem 1.2rem 1.25rem;
        max-height: min(90vh, 720px);
        overflow: auto;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .modal .hint {
        margin: 0 0 0.85rem;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.45;
      }

      .secret-row {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 0.85rem;
      }

      .secret-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .secret-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .modal-footer {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.5rem;
      }

      .modal-footer .primary {
        width: auto;
        padding: 0.55rem 1rem;
      }

      .settings-status {
        min-height: 1.25rem;
        font-size: 0.85rem;
        margin: 0.35rem 0 0.25rem;
      }

      .settings-status.ok {
        color: var(--recommend);
      }

      .settings-status.err {
        color: var(--danger);
      }

      .layout {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(300px, 400px) 1fr;
        gap: 1rem;
        padding: 0 1.25rem 1.25rem;
        min-height: 0;
      }

      .side,
      .map-pane {
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid rgba(229, 231, 235, 0.9);
        min-height: 0;
      }

      .side {
        overflow: auto;
        padding: 1.15rem 1.15rem 1.35rem;
        display: flex;
        flex-direction: column;
        gap: 1.15rem;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .section-title .count {
        font-weight: 500;
        color: var(--muted);
        font-size: 0.9rem;
      }

      label.field {
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }

      input,
      select {
        font: inherit;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: var(--radius-sm);
        width: 100%;
      }

      input:focus,
      select:focus {
        outline: 2px solid color-mix(in srgb, var(--blue) 35%, transparent);
        border-color: color-mix(in srgb, var(--blue) 55%, var(--line));
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        padding: 0.55rem 0.85rem;
        border-radius: var(--radius-sm);
        color: var(--ink);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button.ghost {
        background: transparent;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 650;
        padding: 0.85rem 1.1rem;
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(5, 150, 105, 0.22);
      }

      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button.primary:disabled {
        filter: none;
        box-shadow: none;
      }

      button.blue {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        font-weight: 600;
      }

      button.blue:hover:not(:disabled) {
        filter: brightness(1.05);
      }

      button.outline-blue {
        border-color: color-mix(in srgb, var(--blue) 45%, var(--line));
        color: var(--blue);
        background: #fff;
      }

      .pick-address {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.85rem 1rem;
        border: 1.5px dashed color-mix(in srgb, var(--blue) 45%, var(--line));
        color: var(--blue);
        background: var(--blue-soft);
        font-weight: 600;
      }

      .pick-address:disabled {
        opacity: 0.45;
      }

      .address-picker {
        display: grid;
        gap: 0.65rem;
        margin-top: 0.15rem;
      }

      .address-picker[hidden] {
        display: none;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
      }

      .picker-actions {
        display: flex;
        gap: 0.5rem;
      }

      .picker-actions button {
        flex: 1;
      }

      .geocode-panel {
        display: grid;
        gap: 0.35rem;
        max-height: 220px;
        overflow: auto;
        padding: 0.15rem;
      }

      .geocode-panel[hidden] {
        display: none;
      }

      .candidate-lead {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 500;
      }

      .choice {
        display: flex;
        gap: 0.55rem;
        align-items: flex-start;
        font-weight: 400;
        font-size: 0.92rem;
        padding: 0.55rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        cursor: pointer;
        background: #fff;
      }

      .choice:hover,
      .choice.selected {
        background: var(--blue-soft);
        border-color: color-mix(in srgb, var(--blue) 40%, var(--line));
      }

      .choice input {
        width: auto;
        margin-top: 0.2rem;
        padding: 0;
      }

      .choice .sub {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 0.15rem;
      }

      .list-empty {
        text-align: center;
        color: var(--muted);
        padding: 1.25rem 0.75rem;
        border: 1px dashed var(--line);
        border-radius: var(--radius-sm);
        background: #fafafa;
      }

      .list-empty .icon {
        font-size: 1.6rem;
        margin-bottom: 0.35rem;
      }

      .list-empty p {
        margin: 0.15rem 0;
        font-size: 0.9rem;
      }

      .participant-list {
        display: grid;
        gap: 0.55rem;
      }

      .participant-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.35rem 0.75rem;
        align-items: start;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
      }

      .participant-item strong {
        font-size: 0.95rem;
      }

      .participant-item .addr {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .participant-item .remove {
        border: none;
        background: transparent;
        color: var(--danger);
        padding: 0.1rem 0.25rem;
        font-size: 0.85rem;
      }

      .prefs {
        display: grid;
        gap: 0.15rem;
      }

      #status {
        min-height: 1.2rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .hint {
        color: var(--muted);
        font-size: 0.82rem;
        margin: 0 0 0.65rem;
        line-height: 1.45;
      }

      .map-pane {
        position: relative;
        min-height: 320px;
        overflow: hidden;
        background: #eef2f7;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .map-placeholder,
      .map-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.45rem;
        padding: 2rem;
        text-align: center;
        pointer-events: none;
        z-index: 1;
        background: rgba(255, 255, 255, 0.72);
      }

      .map-placeholder {
        pointer-events: auto;
      }

      .map-empty.hidden,
      .map-placeholder.hidden {
        display: none;
      }

      .map-empty .map-icon,
      .map-placeholder .map-icon {
        font-size: 2.4rem;
        margin-bottom: 0.25rem;
      }

      .map-empty h2,
      .map-placeholder h2 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .map-empty p,
      .map-placeholder p {
        margin: 0;
        color: var(--muted);
        max-width: 22rem;
        line-height: 1.5;
        justify-self: center;
      }

      .drawer {
        position: absolute;
        left: 0.85rem;
        right: 0.85rem;
        bottom: 0.85rem;
        max-height: min(48%, 420px);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.12);
        z-index: 2;
        transform: translateY(110%);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.28s ease,
          opacity 0.2s ease;
      }

      .drawer.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--line);
      }

      .drawer-header h2 {
        margin: 0;
        font-size: 1rem;
      }

      .drawer-body {
        overflow: auto;
        padding: 0.85rem;
        display: grid;
        gap: 0.75rem;
      }

      .empty {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid #fecaca;
        padding: 1rem 1.1rem;
        border-radius: var(--radius-sm);
        line-height: 1.45;
      }

      .empty p {
        margin: 0 0 0.65rem;
      }

      .empty p:last-child {
        margin-bottom: 0;
      }

      .ranking {
        display: grid;
        gap: 0.65rem;
      }

      .entry {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 0.85rem 0.95rem;
        cursor: pointer;
        text-align: left;
        width: 100%;
        font: inherit;
        color: inherit;
        border-radius: var(--radius-sm);
      }

      .entry:hover {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      }

      .entry.recommendation {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .entry.active {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .entry h3 {
        margin: 0 0 0.2rem;
        font-size: 1.05rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--recommend);
        margin-bottom: 0.35rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 0.5rem;
      }

      .distances {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      @media (max-width: 840px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(48vh, 1fr);
        }

        .topbar {
          padding: 0.85rem 1rem 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">📍</div>
          <div class="brand-text">
            <h1 id="product-title">约了吗</h1>
            <p class="tagline" data-i18n="tagline"></p>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="api-pill offline" id="api-pill">
            <span class="dot" aria-hidden="true"></span>
            <span id="api-pill-text"></span>
          </div>
          <button type="button" class="ghost" id="open-service-settings" data-i18n="serviceSettings">
            Service settings
          </button>
          <button type="button" class="ghost" id="lang-toggle" aria-label="Language">
            EN
          </button>
        </div>
      </header>

      <div class="modal-backdrop" id="service-settings-modal" hidden>
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="service-settings-title"
        >
          <div class="modal-header">
            <h2 id="service-settings-title" data-i18n="serviceSettings"></h2>
            <button type="button" class="ghost" id="close-service-settings" data-i18n="cancel"></button>
          </div>
          <p class="hint" data-i18n="serviceSettingsHint"></p>
          <div class="secret-row">
            <label class="field" for="settings-amap-key">
              <span data-i18n="amapKeyLabel"></span>
              <input
                id="settings-amap-key"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="secretKeepPlaceholder"
              />
            </label>
            <div class="secret-meta">
              <span id="settings-amap-key-status"></span>
              <div class="secret-actions">
                <button type="button" class="ghost" id="clear-amap-key" data-i18n="clearSecret"></button>
              </div>
            </div>
          </div>
          <div class="secret-row">
            <label class="field" for="settings-amap-js-key">
              <span data-i18n="amapJsKeyLabel"></span>
              <input
                id="settings-amap-js-key"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="secretKeepPlaceholder"
              />
            </label>
            <div class="secret-meta">
              <span id="settings-amap-js-key-status"></span>
              <div class="secret-actions">
                <button type="button" class="ghost" id="clear-amap-js-key" data-i18n="clearSecret"></button>
              </div>
            </div>
          </div>
          <div class="secret-row">
            <label class="field" for="settings-amap-security-js-code">
              <span data-i18n="amapSecurityJsCodeLabel"></span>
              <input
                id="settings-amap-security-js-code"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="secretKeepPlaceholder"
              />
            </label>
            <div class="secret-meta">
              <span id="settings-amap-security-js-code-status"></span>
              <div class="secret-actions">
                <button
                  type="button"
                  class="ghost"
                  id="clear-amap-security-js-code"
                  data-i18n="clearSecret"
                ></button>
              </div>
            </div>
          </div>
          <div class="secret-row">
            <label class="field" for="settings-amap-qps">
              <span data-i18n="amapQpsLabel"></span>
              <input
                id="settings-amap-qps"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                autocomplete="off"
                data-i18n-placeholder="amapQpsPlaceholder"
              />
            </label>
            <p class="hint" data-i18n="amapQpsHint" style="margin: 0"></p>
          </div>
          <p class="settings-status" id="settings-status" aria-live="polite"></p>
          <div class="modal-footer">
            <button type="button" class="ghost" id="cancel-service-settings" data-i18n="cancel"></button>
            <button type="button" class="primary" id="save-service-settings" data-i18n="saveSettings"></button>
          </div>
        </div>
      </div>

      <div class="layout">
        <aside class="side">
          <section>
            <h2 class="section-title" data-i18n="addSection"></h2>
            <label class="field">
              <span data-i18n="label"></span>
              <input id="composer-label" name="label" data-i18n-placeholder="labelPlaceholder" />
            </label>
            <button type="button" class="pick-address" id="open-address-picker" data-i18n="pickAddress"></button>
            <div class="address-picker" id="address-picker" hidden>
              <div class="search-row">
                <input
                  id="composer-address"
                  data-i18n-placeholder="addressPlaceholder"
                />
                <button type="button" class="blue" id="lookup-address" data-i18n="lookupAddress"></button>
              </div>
              <div class="geocode-panel" id="geocode-panel" hidden></div>
              <div class="picker-actions">
                <button type="button" class="outline-blue" id="cancel-picker" data-i18n="cancel"></button>
              </div>
            </div>
          </section>

          <section>
            <h2 class="section-title">
              <span data-i18n="listSection"></span>
              <span class="count" id="list-count"></span>
            </h2>
            <div class="participant-list" id="participant-list"></div>
          </section>

          <form id="search-form">
            <section class="prefs">
              <h2 class="section-title" data-i18n="prefsSection"></h2>
              <label class="field">
                <span data-i18n="brand"></span>
                <input name="brand" value="" required data-i18n-placeholder="brandPlaceholder" />
              </label>
              <label class="field">
                <span data-i18n="objective"></span>
                <select name="objective">
                  <option value="total_distance" data-i18n="objectiveTotal"></option>
                  <option value="minimax" data-i18n="objectiveMinimax"></option>
                </select>
              </label>
              <label class="field">
                <span data-i18n="radius"></span>
                <input
                  name="radiusMeters"
                  type="number"
                  min="1"
                  data-i18n-placeholder="radiusPlaceholder"
                />
              </label>
            </section>

            <button class="primary" type="submit" id="search-button" data-i18n="search"></button>
            <div id="status" role="status" aria-live="polite"></div>
          </form>
        </aside>

        <section class="map-pane" aria-label="Map">
          <div id="map"></div>
          <div class="map-placeholder" id="map-placeholder">
            <div class="map-icon" aria-hidden="true">🗺️</div>
            <h2 data-i18n="mapUnavailableTitle"></h2>
            <p data-i18n="mapUnavailableBody"></p>
          </div>
          <div class="map-empty" id="map-empty">
            <div class="map-icon" aria-hidden="true">🗺️</div>
            <h2 data-i18n="mapEmptyTitle"></h2>
            <p data-i18n="mapEmptyBody"></p>
          </div>
          <div class="drawer" id="drawer" aria-hidden="true" inert>
            <div class="drawer-header">
              <h2 id="drawer-title"></h2>
              <button type="button" class="ghost" id="drawer-close" data-i18n="drawerCollapse"></button>
            </div>
            <div class="drawer-body" id="drawer-body"></div>
          </div>
        </section>
      </div>
    </div>

    <script>

          chooseMatch: "请在下方选择一个匹配地址。",

          noGeocode: (addr) => `找不到「${addr}」的匹配结果，请换一个地址。`,

          mapProviderQps:
            "高德调用过于频繁。请稍后再试，或在服务设置中调低 AMAP_QPS。",
          candidateLead: (addr) => `「${addr}」的匹配结果：`,
          emptyHint: "加大搜索半径或更换品牌，然后再次搜索。",
          objectiveTotalShort: "总距离（求和）",
          objectiveMinimaxShort: "最远人最小（最大距离）",
          scoreMeta: (score, objectiveLabel) => `得分 ${score} 米（${objectiveLabel}）`,
          mapLoadError: "高德地图加载失败，请检查 AMAP_JS_KEY / 安全密钥。",
        },
      };

      const mapUi = window.__MAP_UI__ && typeof window.__MAP_UI__ === "object"
        ? window.__MAP_UI__
        : { jsKey: "", securityJsCode: "" };

      const form = document.getElementById("search-form");
      const statusEl = document.getElementById("status");
      const searchButton = document.getElementById("search-button");
      const drawerEl = document.getElementById("drawer");
      const drawerTitleEl = document.getElementById("drawer-title");
      const drawerBodyEl = document.getElementById("drawer-body");
      const drawerCloseBtn = document.getElementById("drawer-close");
      const mapPlaceholderEl = document.getElementById("map-placeholder");
      const mapEmptyEl = document.getElementById("map-empty");
      const productTitleEl = document.getElementById("product-title");
      const langToggleBtn = document.getElementById("lang-toggle");
      const openServiceSettingsBtn = document.getElementById("open-service-settings");
      const serviceSettingsModal = document.getElementById("service-settings-modal");
      const closeServiceSettingsBtn = document.getElementById("close-service-settings");
      const cancelServiceSettingsBtn = document.getElementById("cancel-service-settings");
      const saveServiceSettingsBtn = document.getElementById("save-service-settings");
      const clearAmapKeyBtn = document.getElementById("clear-amap-key");
      const clearAmapJsKeyBtn = document.getElementById("clear-amap-js-key");
      const clearAmapSecurityJsCodeBtn = document.getElementById("clear-amap-security-js-code");
      const settingsAmapKeyInput = document.getElementById("settings-amap-key");
      const settingsAmapJsKeyInput = document.getElementById("settings-amap-js-key");
      const settingsAmapSecurityJsCodeInput = document.getElementById(
        "settings-amap-security-js-code",
      );
      const settingsAmapQpsInput = document.getElementById("settings-amap-qps");
      const settingsAmapKeyStatus = document.getElementById("settings-amap-key-status");
      const settingsAmapJsKeyStatus = document.getElementById("settings-amap-js-key-status");
      const settingsAmapSecurityJsCodeStatus = document.getElementById(
        "settings-amap-security-js-code-status",
      );
      const settingsStatusEl = document.getElementById("settings-status");
      const apiPill = document.getElementById("api-pill");
      const apiPillText = document.getElementById("api-pill-text");
      const listEl = document.getElementById("participant-list");
      const listCountEl = document.getElementById("list-count");
      const composerLabel = document.getElementById("composer-label");
      const composerAddress = document.getElementById("composer-address");
      const openPickerBtn = document.getElementById("open-address-picker");
      const addressPicker = document.getElementById("address-picker");
      const lookupBtn = document.getElementById("lookup-address");
      const cancelPickerBtn = document.getElementById("cancel-picker");
      const geocodePanel = document.getElementById("geocode-panel");

      /** @type {'en'|'zh'} */
      let locale = detectLocale();
      /** @type {Array<{ id: string, label: string, coordinates: {lat:number,lng:number}, formattedAddress: string }>} */
      let participants = [];
      /** @type {null | { data: any, participants: any[] }} */
      let lastRanking = null;
      let selectedBranchIndex = 0;
      let searchInFlight = false;
      let settingsSaveInFlight = false;
      let geocodeInFlight = false;
      let geocodeRequestId = 0;
      /** @type {any[]} */
      let pendingCandidates = [];
      let pendingQuery = "";

      /** @type {any} */
      let AMapNS = null;
      /** @type {any} */
      let map = null;
      /** @type {any[]} */
      let participantMarkers = [];
      /** @type {any[]} */
      let branchMarkers = [];

      function detectLocale() {
        try {
          const saved = localStorage.getItem(LOCALE_KEY);
          if (saved === "zh" || saved === "en") return saved;
        } catch {
          /* ignore */
        }
        const nav = (navigator.language || "en").toLowerCase();
        return nav.startsWith("zh") ? "zh" : "en";
      }

      function t(key, ...args) {
        const table = STRINGS[locale];
        const value = table[key] ?? STRINGS.en[key] ?? key;
        return typeof value === "function" ? value(...args) : value;
      }

      function applyI18n() {
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        document.title = t("productTitle");
        productTitleEl.textContent = t("productTitle");
        langToggleBtn.textContent = t("langToggle");
        updateApiPill();

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (key) el.textContent = t(key);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (key && "placeholder" in el) el.placeholder = t(key);
        });
        // Search button shows progress while a search is running.
        searchButton.textContent = searchInFlight ? t("searching") : t("search");

        renderParticipantList();
        if (geocodePanel && !geocodePanel.hidden && pendingCandidates.length) {
          renderCandidates(pendingQuery, pendingCandidates);
        }
        if (drawerEl.classList.contains("open") && lastRanking) {
          openDrawer(
            t("drawerRankingTitle"),
            renderRanking(lastRanking.data, lastRanking.participants),
          );
        }
        if (!serviceSettingsModal.hidden) {
          refreshSecretStatusesFromLabels();
        }
      }

      function updateApiPill() {
        const online = Boolean((mapUi.jsKey || "").trim());
        apiPill.classList.toggle("offline", !online);
        apiPillText.textContent = online ? t("apiConnected") : t("apiOffline");
      }

      langToggleBtn.addEventListener("click", () => {
        locale = locale === "zh" ? "en" : "zh";
        try {
          localStorage.setItem(LOCALE_KEY, locale);
        } catch {
          /* ignore */
        }
        applyI18n();
      });

      let clearAmapKeyRequested = false;
      let clearAmapJsKeyRequested = false;
      let clearAmapSecurityJsCodeRequested = false;
      /** @type {{ amapKey: boolean, amapJsKey: boolean, amapSecurityJsCode: boolean }} */
      let secretConfigured = {
        amapKey: false,
        amapJsKey: false,
        amapSecurityJsCode: false,
      };

      function setSettingsStatus(message, kind) {
        settingsStatusEl.textContent = message || "";
        settingsStatusEl.classList.toggle("ok", kind === "ok");
        settingsStatusEl.classList.toggle("err", kind === "err");
      }

      function updateAmapKeyStatus(configured) {
        secretConfigured.amapKey = configured;
        settingsAmapKeyStatus.textContent = configured
          ? t("amapKeyConfigured")
          : t("amapKeyMissing");
      }

      function updateAmapJsKeyStatus(configured) {
        secretConfigured.amapJsKey = configured;
        settingsAmapJsKeyStatus.textContent = configured
          ? t("amapJsKeyConfigured")
          : t("amapJsKeyMissing");
      }

      function updateAmapSecurityStatus(configured) {
        secretConfigured.amapSecurityJsCode = configured;
        settingsAmapSecurityJsCodeStatus.textContent = configured
          ? t("amapSecurityConfigured")
          : t("amapSecurityMissing");
      }

      function refreshSecretStatusesFromLabels() {
        updateAmapKeyStatus(secretConfigured.amapKey);
        updateAmapJsKeyStatus(secretConfigured.amapJsKey);
        updateAmapSecurityStatus(secretConfigured.amapSecurityJsCode);
      }

      function applySettingsResponse(body) {
        updateAmapKeyStatus(Boolean(body?.amapKey?.configured));
        updateAmapJsKeyStatus(Boolean(body?.amapJsKey?.configured));
        updateAmapSecurityStatus(Boolean(body?.amapSecurityJsCode?.configured));
        if (typeof body?.amapQps === "number" && Number.isFinite(body.amapQps)) {
          settingsAmapQpsInput.value = String(body.amapQps);
        }
      }

      function openServiceSettings() {
        clearAmapKeyRequested = false;
        clearAmapJsKeyRequested = false;
        clearAmapSecurityJsCodeRequested = false;
        settingsAmapKeyInput.value = "";
        settingsAmapJsKeyInput.value = "";
        settingsAmapSecurityJsCodeInput.value = "";
        settingsAmapQpsInput.value = "";
        setSettingsStatus("", null);
        serviceSettingsModal.hidden = false;
        serviceSettingsModal.classList.add("open");
        settingsAmapKeyInput.focus();
        fetch("/api/service-settings")
          .then((res) => res.json())
          .then((body) => {
            applySettingsResponse(body);
          })
          .catch(() => {
            setSettingsStatus(t("settingsSaveFailed"), "err");
          });
      }

      function closeServiceSettings() {
        serviceSettingsModal.classList.remove("open");
        serviceSettingsModal.hidden = true;
        openServiceSettingsBtn.focus();
      }

      openServiceSettingsBtn.addEventListener("click", openServiceSettings);
      closeServiceSettingsBtn.addEventListener("click", closeServiceSettings);
      cancelServiceSettingsBtn.addEventListener("click", closeServiceSettings);
      serviceSettingsModal.addEventListener("click", (ev) => {
        if (ev.target === serviceSettingsModal) closeServiceSettings();
      });
      serviceSettingsModal.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") {
          ev.preventDefault();
          closeServiceSettings();
          return;
        }
        if (
          ev.key === "Enter" &&
          ev.target instanceof HTMLInputElement &&
          !settingsSaveInFlight
        ) {
          ev.preventDefault();
          saveServiceSettingsBtn.click();
        }
      });

      clearAmapKeyBtn.addEventListener("click", () => {
        clearAmapKeyRequested = true;
        settingsAmapKeyInput.value = "";
        updateAmapKeyStatus(false);
        setSettingsStatus("", null);
      });
      clearAmapJsKeyBtn.addEventListener("click", () => {
        clearAmapJsKeyRequested = true;
        settingsAmapJsKeyInput.value = "";
        updateAmapJsKeyStatus(false);
        setSettingsStatus("", null);
      });
      clearAmapSecurityJsCodeBtn.addEventListener("click", () => {
        clearAmapSecurityJsCodeRequested = true;
        settingsAmapSecurityJsCodeInput.value = "";
        updateAmapSecurityStatus(false);
        setSettingsStatus("", null);
      });

      settingsAmapKeyInput.addEventListener("input", () => {
        if (settingsAmapKeyInput.value.trim()) clearAmapKeyRequested = false;
      });
      settingsAmapJsKeyInput.addEventListener("input", () => {
        if (settingsAmapJsKeyInput.value.trim()) clearAmapJsKeyRequested = false;
      });
      settingsAmapSecurityJsCodeInput.addEventListener("input", () => {
        if (settingsAmapSecurityJsCodeInput.value.trim()) {
          clearAmapSecurityJsCodeRequested = false;
        }
      });

      saveServiceSettingsBtn.addEventListener("click", async () => {
        if (settingsSaveInFlight) return;
        settingsSaveInFlight = true;
        saveServiceSettingsBtn.disabled = true;
        const payload = {};
        if (clearAmapKeyRequested) payload.clearAmapKey = true;
        else payload.amapKey = settingsAmapKeyInput.value;
        if (clearAmapJsKeyRequested) payload.clearAmapJsKey = true;
        else payload.amapJsKey = settingsAmapJsKeyInput.value;
        if (clearAmapSecurityJsCodeRequested) payload.clearAmapSecurityJsCode = true;
        else payload.amapSecurityJsCode = settingsAmapSecurityJsCodeInput.value;
        const qpsRaw = settingsAmapQpsInput.value.trim();
        if (qpsRaw !== "") payload.amapQps = qpsRaw;

        setSettingsStatus("", null);
        try {
          const res = await fetch("/api/service-settings", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setSettingsStatus(body.error || t("settingsSaveFailed"), "err");
            return;
          }
          clearAmapKeyRequested = false;
          clearAmapJsKeyRequested = false;
          clearAmapSecurityJsCodeRequested = false;
          settingsAmapKeyInput.value = "";
          settingsAmapJsKeyInput.value = "";
          settingsAmapSecurityJsCodeInput.value = "";
          applySettingsResponse(body);
          setSettingsStatus(
            body.reloadRequired ? t("settingsSavedReload") : t("settingsSaved"),
            "ok",
          );
        } catch {
          setSettingsStatus(t("settingsSaveFailed"), "err");
        } finally {
          settingsSaveInFlight = false;
          saveServiceSettingsBtn.disabled = false;
        }
      });

      function updateSearchGate() {
        searchButton.disabled = searchInFlight || participants.length < 2;
      }

      function clearRankingResults() {
        lastRanking = null;
        clearBranchMarkers();
        if (drawerEl.classList.contains("open")) closeDrawer();
      }

      function syncMapFromParticipants() {
        paintParticipantMarkers(participants);
        updateMapEmptyVisibility();
        updateSearchGate();
      }

      function renderParticipantList() {
        listCountEl.textContent = t("peopleCount", participants.length);
        if (participants.length === 0) {
          listEl.innerHTML = `
            <div class="list-empty">
              <div class="icon" aria-hidden="true">👥</div>
              <p>${escapeHtml(t("listEmptyTitle"))}</p>
              <p>${escapeHtml(t("listEmptyBody"))}</p>
            </div>`;
          return;
        }

        listEl.innerHTML = participants
          .map(
            (p, index) => `
            <div class="participant-item" data-index="${index}">
              <strong>${escapeHtml(p.label)}</strong>
              <button type="button" class="remove" data-index="${index}">${escapeHtml(t("remove"))}</button>
              <div class="addr">${escapeHtml(p.formattedAddress)}</div>
            </div>`,
          )
          .join("");
      }

      listEl.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.classList.contains("remove")) return;
        const index = Number(target.dataset.index);
        if (!Number.isFinite(index)) return;
        participants.splice(index, 1);
        participants = participants.map((p, i) => ({ ...p, id: `p${i + 1}` }));
        clearRankingResults();
        renderParticipantList();
        syncMapFromParticipants();
        statusEl.textContent = "";
      });

      function openAddressPicker() {
        const name = composerLabel.value.trim();
        if (!name) {
          statusEl.textContent = t("needName");
          composerLabel.focus();
          return;
        }
        statusEl.textContent = "";
        openPickerBtn.hidden = true;
        addressPicker.hidden = false;
        composerAddress.value = "";
        geocodePanel.hidden = true;
        geocodePanel.innerHTML = "";
        pendingCandidates = [];
        pendingQuery = "";
        composerAddress.focus();
      }

      function closeAddressPicker() {
        addressPicker.hidden = true;
        openPickerBtn.hidden = false;
        geocodePanel.hidden = true;
        geocodePanel.innerHTML = "";
        pendingCandidates = [];
        pendingQuery = "";
        composerAddress.value = "";
      }

      openPickerBtn.addEventListener("click", openAddressPicker);
      composerLabel.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          openAddressPicker();
        }
      });
      cancelPickerBtn.addEventListener("click", () => {
        closeAddressPicker();
        statusEl.textContent = "";
      });

      lookupBtn.addEventListener("click", () => {
        void lookupAddress();
      });
      composerAddress.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          void lookupAddress();
        } else if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          closeAddressPicker();
          statusEl.textContent = "";
          openPickerBtn.focus();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!serviceSettingsModal.hidden) return; // modal handles Escape itself
        if (drawerEl.classList.contains("open")) {
          event.preventDefault();
          closeDrawer();
          searchButton.focus();
        }
      });

      async function lookupAddress() {
        const address = composerAddress.value.trim();
        if (!address) {
          composerAddress.focus();
          return;
        }
        if (geocodeInFlight) return;
        geocodeInFlight = true;
        const requestId = ++geocodeRequestId;
        lookupBtn.disabled = true;
        statusEl.textContent = t("lookingUp");
        geocodePanel.hidden = true;
        geocodePanel.innerHTML = "";
        pendingCandidates = [];
        pendingQuery = address;

        try {
          const res = await fetch("/api/geocode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address }),
          });
          const data = await res.json();
          if (requestId !== geocodeRequestId) return;
          if (!res.ok) {
            throw new Error(apiFailureMessage(data, "Geocode failed"));
          }
          const candidates = data.candidates ?? [];
          if (candidates.length === 0) {
            statusEl.textContent = t("noGeocode", address);
            return;
          }
          if (addressPicker.hidden) return; // picker was closed while looking up
          pendingCandidates = candidates;
          renderCandidates(address, candidates);
          statusEl.textContent = t("chooseMatch");
        } catch (err) {
          if (requestId !== geocodeRequestId) return;
          statusEl.textContent = err.message ?? String(err);
        } finally {
          if (requestId === geocodeRequestId) {
            geocodeInFlight = false;
            lookupBtn.disabled = false;
          }
        }
      }

      function renderCandidates(address, candidates) {
        geocodePanel.innerHTML = `
          <p class="candidate-lead">${escapeHtml(t("candidateLead", address))}</p>
          ${candidates
            .map((c, i) => {
              const title = c.name || c.formattedAddress;
              const sub =
                c.name && c.formattedAddress && c.name !== c.formattedAddress
                  ? c.formattedAddress
                  : "";
              return `
              <label class="choice">
                <input type="radio" name="geocode-pick" value="${i}" />
                <span>
                  ${escapeHtml(title)}
                  ${sub ? `<span class="sub">${escapeHtml(sub)}</span>` : ""}
                </span>
              </label>`;
            })
            .join("")}
        `;
        geocodePanel.hidden = false;
        geocodePanel.querySelectorAll('input[type="radio"]').forEach((input) => {
          input.addEventListener("change", () => {
            const index = Number(input.value);
            const chosen = candidates[index];
            if (!chosen) return;
            addParticipantFromCandidate(chosen);
          });
        });
      }

      function addParticipantFromCandidate(chosen) {
        const label = composerLabel.value.trim() || t("label");
        participants.push({
          id: `p${participants.length + 1}`,
          label,
          coordinates: chosen.coordinates,
          formattedAddress: chosen.formattedAddress,
        });
        composerLabel.value = "";
        closeAddressPicker();
        clearRankingResults();
        renderParticipantList();
        syncMapFromParticipants();
        statusEl.textContent = "";
        composerLabel.focus();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (searchInFlight) return;
        if (participants.length < 2) {
          statusEl.textContent = t("needAllResolved");
          updateSearchGate();
          return;
        }
        statusEl.textContent = t("searching");
        await runSearch(participants);
      });

      drawerCloseBtn.addEventListener("click", () => {
        closeDrawer();
        searchButton.focus();
      });

      function openDrawer(title, html) {
        drawerTitleEl.textContent = title;
        drawerBodyEl.innerHTML = html;
        drawerEl.inert = false;
        drawerEl.classList.add("open");
        drawerEl.setAttribute("aria-hidden", "false");
      }

      function closeDrawer() {
        drawerEl.classList.remove("open");
        drawerEl.setAttribute("aria-hidden", "true");
        drawerEl.inert = true;
      }

      drawerBodyEl.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const entryBtn = target.closest(".entry");
        if (entryBtn instanceof HTMLElement && entryBtn.dataset.rankIndex != null) {
          const index = Number(entryBtn.dataset.rankIndex);
          if (Number.isFinite(index)) selectBranch(index, true);
        }
      });

      async function runSearch(people) {
        statusEl.textContent = t("searching");
        searchInFlight = true;
        searchButton.textContent = t("searching");
        updateSearchGate();

        const fd = new FormData(form);
        const radiusRaw = fd.get("radiusMeters");
        const payload = {
          participants: people.map(({ id, label, coordinates }) => ({
            id,
            label,
            coordinates,
          })),
          brand: fd.get("brand"),
          objective: fd.get("objective"),
        };
        if (radiusRaw && String(radiusRaw).trim() !== "") {
          payload.radiusMeters = Number(radiusRaw);
        }

        try {
          const res = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (data.kind === "empty_candidate_set") {
            statusEl.textContent = "";
            clearBranchMarkers();
            lastRanking = null;
            openDrawer(t("drawerEmptyTitle"), renderEmptyCandidateSet(data.message));
            return;
          }

          if (data.kind === "map_provider_error") {
            statusEl.textContent = data.message ?? "Map provider error";
            return;
          }

          if (!res.ok) {
            statusEl.textContent = apiFailureMessage(data, "Search failed");
            return;
          }

          statusEl.textContent = "";
          lastRanking = { data, participants: people };
          selectedBranchIndex = 0;
          paintBranchMarkers(data.entries);
          openDrawer(t("drawerRankingTitle"), renderRanking(data, people));
          selectBranch(0, true);
        } catch (err) {
          statusEl.textContent = err.message ?? String(err);
        } finally {
          searchInFlight = false;
          searchButton.textContent = t("search");
          updateSearchGate();
        }
      }

      function renderEmptyCandidateSet(message) {
        return `
          <div class="empty">
            <p>${escapeHtml(message)}</p>
            <p class="hint">${escapeHtml(t("emptyHint"))}</p>
          </div>`;
      }

      function labelById(people) {
        const mapLabels = Object.create(null);
        for (const p of people) {
          mapLabels[p.id] = p.label || p.id;
        }
        return mapLabels;
      }

      function renderRanking(data, people) {
        const labels = labelById(people ?? participants);
        const objectiveLabel =
          data.objective === "minimax"
            ? t("objectiveMinimaxShort")
            : t("objectiveTotalShort");
        const entries = data.entries
          .map((entry, index) => {
            const isTop = index === 0;
            const distances = Object.entries(entry.distances)
              .map(([id, meters]) => {
                const name = labels[id] ?? id;
                return `<li><strong>${escapeHtml(name)}</strong>: ${meters.toLocaleString()} m</li>`;
              })
              .join("");
            return `
              <button type="button" class="entry ${isTop ? "recommendation" : ""} ${index === selectedBranchIndex ? "active" : ""}" data-rank-index="${index}">
                ${isTop ? `<div class="badge">${escapeHtml(t("recommendation"))}</div>` : ""}
                <h3>${escapeHtml(entry.branch.name)}</h3>
                <p class="meta">${escapeHtml(entry.branch.address)} · ${escapeHtml(t("scoreMeta", entry.score.toLocaleString(), objectiveLabel))}</p>
                <ul class="distances">${distances}</ul>
              </button>
            `;
          })
          .join("");
        return `<div class="ranking">${entries}</div>`;
      }

      function selectBranch(index, panMap) {
        selectedBranchIndex = index;
        drawerBodyEl.querySelectorAll(".entry").forEach((el) => {
          el.classList.toggle("active", Number(el.dataset.rankIndex) === index);
        });
        refreshBranchMarkerLabels();
        if (panMap && branchMarkers[index] && map) {
          const marker = branchMarkers[index];
          map.setCenter(marker.getPosition());
          map.setZoom(Math.max(map.getZoom(), 14));
        }
      }

      function apiFailureMessage(data, fallback) {
        if (data && data.kind === "map_provider_error") {
          const raw = typeof data.message === "string" ? data.message : "";
          if (/INVALID_USER_KEY|USERKEY_PLAT_NOMATCH|INVALID_USER_SCODE/i.test(raw)) {
            return t("mapProviderBadKey");
          }
          if (/CUQPS_HAS_EXCEEDED|QPS/i.test(raw)) {
            return t("mapProviderQps");
          }
          if (/ENGINE_RESPONSE_DATA_ERROR/i.test(raw)) {
            return t("mapProviderGeneric");
          }
          if (raw) return t("mapProviderGeneric");
        }
        if (data && typeof data.message === "string" && data.message) {
          return data.message;
        }
        if (data && typeof data.error === "string" && data.error) {
          return data.error;
        }
        return fallback;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function lngLat(coords) {
        return [coords.lng, coords.lat];
      }

      function clearMarkers(list) {
        for (const m of list) {
          try {
            m.setMap(null);
          } catch {
            /* ignore */
          }
        }
        list.length = 0;
      }

      function clearParticipantMarkers() {
        clearMarkers(participantMarkers);
      }

      function clearBranchMarkers() {
        clearMarkers(branchMarkers);
      }

      function fitToMarkers() {
        if (!map) return;
        const all = [...participantMarkers, ...branchMarkers];
        if (all.length === 0) return;
        map.setFitView(all, false, [60, 60, 60, 80]);
      }

      function updateMapEmptyVisibility() {
        const hasPeople = participants.length > 0;
        mapEmptyEl.classList.toggle("hidden", Boolean(hasPeople) || !map);
      }

      function paintParticipantMarkers(people) {
        if (!map || !AMapNS) return;
        clearParticipantMarkers();
        for (const p of people) {
          const marker = new AMapNS.Marker({
            position: lngLat(p.coordinates),
            title: p.label,
            label: {
              content: `<span style="padding:2px 6px;background:#fff;border:1px solid #059669;color:#047857;font-size:12px;border-radius:6px;">${escapeHtml(p.label)}</span>`,
              direction: "top",
            },
          });
          marker.setMap(map);
          participantMarkers.push(marker);
        }
        fitToMarkers();
      }

      function paintBranchMarkers(entries) {
        if (!map || !AMapNS) return;
        clearBranchMarkers();
        const slice = entries.slice(0, MAP_BRANCH_LIMIT);
        slice.forEach((entry, index) => {
          const isTop = index === 0;
          const marker = new AMapNS.Marker({
            position: lngLat(entry.branch.coordinates),
            title: entry.branch.name,
            label: {
              content: branchLabelHtml(entry.branch.name, isTop, false),
              direction: "top",
            },
          });
          marker._rankIndex = index;
          marker._branchName = entry.branch.name;
          marker._isTop = isTop;
          marker.on("click", () => {
            selectBranch(index, false);
            const el = drawerBodyEl.querySelector(`[data-rank-index="${index}"]`);
            if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
            if (!drawerEl.classList.contains("open") && lastRanking) {
              openDrawer(
                t("drawerRankingTitle"),
                renderRanking(lastRanking.data, lastRanking.participants),
              );
              selectBranch(index, false);
            }
          });
          marker.setMap(map);
          branchMarkers.push(marker);
        });
        fitToMarkers();
      }

      function branchLabelHtml(name, isTop, selected) {
        const bg = selected ? "#059669" : isTop ? "#ecfdf5" : "#fff";
        const fg = selected ? "#fff" : "#1f2937";
        const weight = isTop || selected ? "600" : "400";
        return `<span style="padding:2px 6px;background:${bg};color:${fg};border:1px solid #059669;font-size:12px;font-weight:${weight};border-radius:6px;">${escapeHtml(name)}</span>`;
      }

      function refreshBranchMarkerLabels() {
        for (const marker of branchMarkers) {
          const selected = marker._rankIndex === selectedBranchIndex;
          marker.setLabel({
            content: branchLabelHtml(marker._branchName, marker._isTop, selected),
            direction: "top",
          });
        }
      }

      function loadAmap() {
        const jsKey = (mapUi.jsKey || "").trim();
        if (!jsKey) {
          mapPlaceholderEl.classList.remove("hidden");
          mapEmptyEl.classList.add("hidden");
          return Promise.resolve(false);
        }

        mapPlaceholderEl.classList.add("hidden");

        const security = (mapUi.securityJsCode || "").trim();
        if (security) {
          window._AMapSecurityConfig = { securityJsCode: security };
        }

        return new Promise((resolve) => {
          const existing = document.querySelector("script[data-amap-loader]");
          const start = () => {
            if (!window.AMapLoader) {
              statusEl.textContent = t("mapLoadError");
              mapPlaceholderEl.classList.remove("hidden");
              resolve(false);
              return;
            }
            window.AMapLoader.load({
              key: jsKey,
              version: "2.0",
            })
              .then((AMap) => {
                AMapNS = AMap;
                map = new AMap.Map("map", {
                  zoom: 11,
                  center: [116.397428, 39.90923],
                  viewMode: "2D",
                });
                mapEmptyEl.classList.remove("hidden");
                resolve(true);
              })
              .catch(() => {
                statusEl.textContent = t("mapLoadError");
                mapPlaceholderEl.classList.remove("hidden");
                resolve(false);
              });
          };

          if (window.AMapLoader) {
            start();
            return;
          }

          if (existing) {
            existing.addEventListener("load", start);
            existing.addEventListener("error", () => {
              mapPlaceholderEl.classList.remove("hidden");
              resolve(false);
            });
            return;
          }

          const script = document.createElement("script");
          script.src = "https://webapi.amap.com/loader.js";
          script.async = true;
          script.dataset.amapLoader = "1";
          script.onload = start;
          script.onerror = () => {
            mapPlaceholderEl.classList.remove("hidden");
            resolve(false);
          };
          document.head.appendChild(script);
        });
      }

      applyI18n();
      updateSearchGate();
      loadAmap().then(() => {
        updateMapEmptyVisibility();
        updateApiPill();
      });
    </script>
  </body>
</html>
